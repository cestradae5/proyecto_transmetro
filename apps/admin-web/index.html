<!doctype html>
<html class="h-full" lang="es" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta name="description" content="Transmetro administration portal" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#001251",
              "primary-container": "#0a257a",
              secondary: "#2d6c00",
              "secondary-container": "#a6f875",
              surface: "#f8fafc",
              "on-surface": "#0f172a",
              "on-surface-variant": "#475569",
              outline: "#94a3b8",
              "outline-variant": "#e2e8f0"
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Plus Jakarta Sans", "Inter", "sans-serif"]
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html, body { margin: 0; padding: 0; height: 100%; }
        body { overscroll-behavior: none; }
        /* @supports (padding: max(0px)) {
          body { padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
        } */
      }
      ::-webkit-scrollbar { display: none; }
      .hero-ribbon-bg {
        background:
          radial-gradient(ellipse 90% 80% at 75% 20%, rgba(132, 204, 22, 0.45) 0%, transparent 60%),
          radial-gradient(circle at 10% 80%, rgba(225, 29, 72, 0.7) 0%, transparent 55%),
          radial-gradient(circle at 90% 75%, rgba(14, 165, 233, 0.6) 0%, transparent 50%),
          linear-gradient(145deg, #0a1f6a 0%, #172554 25%, #312e81 48%, #1e1b4b 75%, #030712 100%);
        position: relative;
      }
      .wave-ribbon-1 {
        position: absolute;
        flex: none;
        inset: -20% -30%;
        background: conic-gradient(from 210deg at 65% 45%, #84cc16 0deg, #3b82f6 80deg, #6366f1 140deg, #e11d48 200deg, #1e3a8a 270deg, #84cc16 360deg);
        filter: blur(52px);
        opacity: 0.82;
        mix-blend-mode: screen;
        transform: rotate(-12deg) scale(1.15);
      }
      .wave-ribbon-2 {
        position: absolute;
        flex: none;
        inset: -10% -20%;
        background: radial-gradient(ellipse 70% 90% at 50% 50%, rgba(255,255,255,0.3) 0%, rgba(147, 197, 253, 0.2) 35%, transparent 70%);
        filter: blur(35px);
        mix-blend-mode: overlay;
        pointer-events: none;
      }
      .ribbon-texture-lines {
        position: absolute;
        flex: none;
        inset: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        background: repeating-linear-gradient(
          -55deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 1.5px,
          transparent 1.5px,
          transparent 8px
        );
        opacity: 0.35;
        mix-blend-mode: soft-light;
      }
    </style>
    <title>Transmetro Administration</title>
  </head>
    <body class="h-full bg-white text-on-surface font-sans antialiased flex">
    <div id="root" class="w-full h-full min-h-screen flex flex-col flex-1"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
